name: Buy Tickets

on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:

jobs:
  buy_tickets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Install dependencies
        run: |
          uv cache clean
          uv sync
      - name: Install playwright
        run: |
          uv run playwright install --with-deps
      - name: Install tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Run main script
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          SIGNAL_API_PHONE: ${{ secrets.SIGNAL_API_PHONE }}
          SIGNAL_API_KEY: ${{ secrets.SIGNAL_API_KEY }}
          BUY_TICKET_MEN: ${{ secrets.BUY_TICKET_MEN }}
          BUY_TICKET_WOMEN: ${{ secrets.BUY_TICKET_WOMEN }}
          BUY_TICKET_FAVORITE_BLOCKS: ${{ secrets.BUY_TICKET_FAVORITE_BLOCKS }}
          BUY_TICKET_TYPE: ${{ secrets.BUY_TICKET_TYPE }}
          BUY_TICKET_VOUCHER_CODE: ${{ secrets.BUY_TICKET_VOUCHER_CODE }}
        run: uv run main.py --tickets